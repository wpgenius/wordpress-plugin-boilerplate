name: CI

# Checks every pull request (and pushes to main): PHP syntax and unit tests on
# each supported PHP version, WordPress Coding Standards, JS/CSS lint, and that
# the committed block build in build/ matches the sources in blocks/, and the
# official WordPress Plugin Check on the plugin as it ships (the release zip).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the lowest version in sync with "Requires PHP" in the plugin header.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer lint

      - run: composer test

  phpcs:
    name: Coding standards (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr

      - run: composer install --no-interaction --no-progress

      - name: Run PHPCS (annotates the PR diff)
        run: vendor/bin/phpcs -q --report-full --report-checkstyle=./phpcs-report.xml || (cs2pr ./phpcs-report.xml && exit 1)

  js-css-lint:
    name: JS/CSS lint and block build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Check that build/ is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- build)" ]; then
            git status --short -- build
            echo "::error::build/ is out of date. Run 'npm run build' and commit build/."
            exit 1
          fi

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the plugin as it ships
        id: package
        run: |
          set -euo pipefail
          . .github/scripts/lib.sh
          slug="${{ vars.PLUGIN_SLUG }}"
          slug="${slug:-${GITHUB_REPOSITORY#*/}}"
          build_package "$RUNNER_TEMP/package/$slug"
          echo "dir=$RUNNER_TEMP/package/$slug" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # The checks WordPress.org runs when reviewing a plugin. Errors fail the
      # job; warnings are shown as annotations on the PR.
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ steps.package.outputs.dir }}
          slug: ${{ steps.package.outputs.slug }}
