name: Release

# Every merge to main is checked; a release is made only when the plugin zip
# would change (the package, filtered by .distignore, is compared with the one
# at the last release). Docs-, CI- or config-only merges make no release and
# no deploy.
#
# Steps, in order:
#   1. Work out the next version (patch by default; the merged PR's
#      `release:minor` / `release:major` label bumps more) and the changelog
#      (one line per issue the released PRs closed).
#   2. Write Version (plugin header), Stable tag and the changelog entry
#      (readme.txt), and commit that to main as "Release vX.Y.Z [skip ci]".
#      Pushed with the RELEASE_DEPLOY_KEY deploy key, which the ruleset lets bypass.
#   3. Tag that commit, build the zip from it, publish the GitHub release.
#   4. Deploy, only while the repo variable DEPLOY_ENABLED is 'true'.
#
# Optional repo variable: PLUGIN_SLUG (zip folder name; defaults to the repo name).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The bot's own release commit never needs another release. The author is
    # checked too, so a pull request titled "Release v..." still gets released.
    if: ${{ !(startsWith(github.event.head_commit.message, 'Release v') && github.event.head_commit.author.name == 'github-actions[bot]') }}
    outputs:
      released: ${{ steps.publish.outputs.released }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare
        # Outside the checkout, so the changelog never ends up in the zip or the commit.
        run: echo "CHANGELOG_FILE=$RUNNER_TEMP/changelog.txt" >> "$GITHUB_ENV"

      - name: Check out main with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Pushes the release commit with the "release-bot" deploy key, which the
          # "Protect main" ruleset lets bypass (bin/setup-github.sh sets both up).
          # Without the secret it falls back to the workflow token (unprotected repos).
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Plan release
        id: plan
        run: bash .github/scripts/release-plan.sh

      - name: Write version and changelog
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bash .github/scripts/stamp-version.sh "$VERSION" "$CHANGELOG_FILE"
          git diff --stat

      - name: Commit release to main
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "Release $TAG [skip ci]" --message "$(cat "$CHANGELOG_FILE")"
          if ! git push origin HEAD:main; then
            echo "::error::Could not push the release commit to main. Check that the RELEASE_DEPLOY_KEY secret and the 'release-bot' deploy key exist and that the 'Protect main' ruleset lets deploy keys bypass (bin/setup-github.sh sets this up), or that main has not moved during the run."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Build release zip
        if: steps.plan.outputs.release == 'true'
        id: build
        run: |
          set -euo pipefail
          . .github/scripts/lib.sh
          slug="${{ vars.PLUGIN_SLUG }}"
          slug="${slug:-${GITHUB_REPOSITORY#*/}}"
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::bad plugin slug '$slug'"; exit 1; }
          stage="$RUNNER_TEMP/stage"
          build_package "$stage/$slug"
          test -f "$stage/$slug/$(main_plugin_file)"
          (cd "$stage" && zip -r -q "$GITHUB_WORKSPACE/$slug.zip" "$slug")
          unzip -l "$slug.zip"
          echo "zip=$slug.zip" >> "$GITHUB_OUTPUT"

      - name: Tag and publish GitHub release
        if: steps.plan.outputs.release == 'true'
        id: publish
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          gh release create "$TAG" "$ZIP" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file "$CHANGELOG_FILE"
          echo "released=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: needs.release.outputs.released == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      deploy: true
    secrets: inherit
