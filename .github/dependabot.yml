version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  # Dependabot PRs need no linked issue; none of these change the plugin zip
  # unless build/ changes, so they normally make no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Dev tools from package.json (@wordpress/scripts and friends), one grouped
  # PR a month. If CI then says build/ is out of date, check out the PR's
  # branch, run `npm run build`, and commit the result to it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build
    labels:
      - dependencies

  # Dev tools from composer.json (PHPCS, PHPStan, PHPUnit), one grouped PR a month.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ['*']
    commit-message:
      prefix: build
    labels:
      - dependencies
